# ==============================================================================
# ArgoCD Application - PROD Environment
# ==============================================================================
# Konfigurasi ArgoCD Application untuk deployment ke PROD namespace.
# Auto-sync DISABLED: deployment ke PROD memerlukan explicit trigger.
#
# Flow: CI/CD pipeline commit image tag ke GitOps repo → ArgoCD detect OutOfSync
#       → DevOps manually sync dari ArgoCD UI/CLI setelah approval di pipeline.
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-application-prod
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: my-application
    environment: production
  annotations:
    # Notifikasi via ArgoCD Notifications (opsional)
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: deployments
    notifications.argoproj.io/subscribe.on-sync-failed.slack: deployments-alerts
    notifications.argoproj.io/subscribe.on-health-degraded.slack: deployments-alerts
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: applications

  source:
    # GitOps repository — single source of truth untuk deployment state
    repoURL: "https://git.company.internal/platform/gitops-config.git"
    targetRevision: main
    path: apps/my-application-prod    # Chart + values dalam 1 directory

  destination:
    server: https://kubernetes.default.svc
    namespace: my-application-prod

  # Sync Policy - MANUAL for PROD
  # Automated sync sengaja TIDAK diaktifkan untuk production.
  # Self-heal membutuhkan automated sync — ini trade-off yang disengaja:
  #   - Lebih aman: tidak ada perubahan tanpa explicit approval
  #   - Rollback: gunakan Jenkinsfile.rollback (git revert → sync)
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m

  # Revision history for rollback capability
  revisionHistoryLimit: 10

  # Ignore HPA-managed replica count
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
