# ==============================================================================
# ArgoCD Application - DEV Environment
# ==============================================================================
# Konfigurasi ArgoCD Application untuk deployment ke DEV namespace.
# Auto-sync ENABLED: setiap perubahan di Git otomatis di-deploy ke DEV.
#
# Pattern: GitOps Repository berisi Helm chart + values per-app per-environment.
# CI/CD pipeline melakukan commit image tag ke repo ini → ArgoCD auto-sync.
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-application-dev
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: my-application
    environment: development
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: applications

  source:
    # GitOps repository — single source of truth untuk deployment state
    # Berisi Helm chart + values.yaml yang di-update oleh CI/CD pipeline
    repoURL: "https://git.company.internal/platform/gitops-config.git"
    targetRevision: main
    path: apps/my-application-dev    # Chart + values dalam 1 directory

  destination:
    server: https://kubernetes.default.svc
    namespace: my-application-dev

  # Sync Policy - AUTO for DEV
  # ArgoCD otomatis deploy setiap ada perubahan di Git (commit dari pipeline)
  syncPolicy:
    automated:
      prune: true          # Remove resources not in Git
      selfHeal: true       # Fix drift automatically
      allowEmpty: false    # Don't sync if source is empty
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Ignore HPA-managed replica count (HPA scales independently)
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
